name: deploy

# Manual only. This workflow runs when a human starts it and nothing else.
# It deploys one exact artifact, and only after the operator's approval record for that
# same commit, publication version, build run and artifact hash has been verified.
# The verification refuses; it never approves.
on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: The commit the operator approved
        required: true
        type: string
      publication_version:
        description: The publication version the operator approved
        required: true
        type: string
      build_run_id:
        description: The id of the build run that produced the approved artifact
        required: true
        type: string
      artifact_sha256:
        description: The SHA-256 of the approved artifact manifest
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/reader-site/package-lock.json

      - name: Install the reader site dependencies
        working-directory: tools/reader-site
        run: npm ci

      - name: Download the approved artifact
        uses: actions/download-artifact@v4
        with:
          name: butt-lab-reader-${{ inputs.approved_commit }}
          path: tools/reader-site/artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.build_run_id }}

      - name: Record the deployment request
        run: |
          cat > deployment-request.json <<'EOF'
          {
            "approvedCommit": "${{ inputs.approved_commit }}",
            "publicationVersion": "${{ inputs.publication_version }}",
            "buildRunId": "${{ inputs.build_run_id }}",
            "artifactSha256": "${{ inputs.artifact_sha256 }}"
          }
          EOF

      - name: Verify the operator approval
        working-directory: tools/reader-site
        run: >
          node scripts/verify-approval.ts
          --approval ../../operator/deployment-approval.json
          --request deployment-request.json
          --artifact artifact

      - name: Publish the verified site
        working-directory: tools/reader-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
