name: deploy

# Manual only. This workflow runs when a human starts it and nothing else.
# It deploys one exact artifact, and only after the operator's approval record for that
# same commit, publication version, build run and artifact hash has been verified.
# The verification refuses; it never approves.
on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: The commit the operator approved
        required: true
        type: string
      publication_version:
        description: The publication version the operator approved
        required: true
        type: string
      build_run_id:
        description: The id of the build run that produced the approved artifact
        required: true
        type: string
      artifact_sha256:
        description: The SHA-256 of the approved artifact manifest
        required: true
        type: string

permissions:
  contents: read
  # actions:read lets download-artifact fetch the approved artifact from the
  # build run that produced it. Without it the workflow stops before the gate.
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/reader-site/package-lock.json

      - name: Install the reader site dependencies
        working-directory: tools/reader-site
        run: npm ci

      - name: Download the approved artifact
        uses: actions/download-artifact@v4
        with:
          name: butt-lab-reader-${{ inputs.approved_commit }}
          path: tools/reader-site/artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.build_run_id }}

      - name: Record the deployment request
        # The workflow inputs are untrusted strings. They are handed to a
        # structured JSON writer through the environment, so no input can ever
        # become shell source. The writer validates every value first.
        working-directory: tools/reader-site
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
          PUBLICATION_VERSION: ${{ inputs.publication_version }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
        run: node scripts/deployment-request.ts

      - name: Verify the operator approval
        working-directory: tools/reader-site
        run: >
          node scripts/verify-approval.ts
          --approval ../../operator/deployment-approval.json
          --request deployment-request.json
          --artifact artifact

      - name: Stage the approved bytes for the assets binding
        # The deployed bytes must be exactly the bytes the operator approved, so the
        # site is copied out of the artifact. This workflow never rebuilds.
        working-directory: tools/reader-site
        run: rm -rf dist && cp -r artifact/site dist

      - name: Publish the verified site
        working-directory: tools/reader-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
