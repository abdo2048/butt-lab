reading_limits:
  - "No patent-office register was queried; legal statuses are database assumptions except one term calculation."
  - "No independent contaminant assay, leachate test, emission measurement or LCA report was located."
  - "Company pages are self-report; absence of a disclosed step is not proof the step does not exist."
  - "Cerdia is abstract-only; Keenat and CN106928486 were read in part; Re-Cig and CNR patent numbers were not located."
  - "Code Effort, TerraCycle and BuffIndia have no located patent; this is search-scoped."
  - "TchaoMegot patent-family association and the CNR/mask-filter grouping are inherited and unverified."
  - "The Korean paving-stone, INERIS and Keenat-LCA notes are secondary summaries, not primary reports."
  - "The retrieval count is the worker's own record; raw tool logs were not supplied."
  - "The Korean paving-stone case and Keenat LCA are secondary comparators, not verdicts on a whole family. Residual stronger phrasing in batch-selection ('directly undermines') and the Keenat spec ('direct precedent') is flagged for the panel."
  - "CO2 is described as avoiding a conventional aqueous/organic wash; 'no solvent wash' language must not be read as literal absence of a dense fluid."
  - "Edited files retain their original in-file unit headers (some say v1.0); the v1.1 label refers to the corrected content hash, and the errata is authoritative for what changed."

