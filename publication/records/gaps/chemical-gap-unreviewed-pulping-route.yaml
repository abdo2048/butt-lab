id: chemical-gap-unreviewed-pulping-route
title: Alkaline pulping has no complete comparison with solvent recovery
publicationState: approved
auditAliases: []
kind: gap
contentKind: unresolved-question
question: Can alkaline pulping and solvent recovery be compared on product quality and the full fate of their liquid and solid waste streams?
gapType: method-coverage
whyItMatters: Alkaline pulping produces cellulose pulp, not recovered cellulose acetate. Reusing the liquor in reported tests does not account for long-term buildup, solids, or any eventual purge.
affectedRecordIds:
  - chemical
evidenceState: source-not-located
validationState: requires-human-validation
nextHumanWork: source-retrieval
falsifierOrDecisionCondition: A comparison needs matched input and output measurements, a documented purge or residuals route, and separate performance criteria for pulp and acetate.
