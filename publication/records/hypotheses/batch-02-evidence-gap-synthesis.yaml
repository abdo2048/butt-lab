priorContext: "Batch-02 established that all six method families fail at least one field of the four-field sink. The Scientist-Inventor role (operator-authorized 2026-11-17) produced a cross-family system inventory and LCA gate covering F0-E, F3-SC-LEL, F4-Hybrid, F5-ED-CIP, and R02-R03-Gate, with executable simulations and falsification tests."
mechanism: "Each variant pairs an upstream M01-Gate with a downstream polishing step (3-stage water + 70% EtOH wash, N2-inerted microfiltration + condenser-first vapor capture + subcritical CO2, scCO2 pre-extraction + immobilized dead fungal mycelium biosorption, pre-oxidation + alkaline/enzymatic CIP on BMED stack, or Tier-1/Tier-2 product gate + named-recipient matrix) to close the four-field sink."
assumptions:
  - M01-Gate diverts >=75% of Cd, Pb, As mass into the ash/fines + residual tobacco fraction.
  - Polishing steps reduce residual nicotine/metals below Tier-1/Tier-2 use-gate limits.
  - All simulations use representative feed loadings and are labeled ai_inference / ai_proposal, not measured values.
unresolvedDependencies:
  - Authorized M01-M08 laboratory measurement to validate partition coefficients and polishing efficiency.
  - Jurisdiction-specific Tier-1/Tier-2 product gate limits.
  - Qualified facility, risk assessment, and lawful contaminated-waste handling for any physical execution.
failureModes:
  - M01-Gate leaves >25% of Cd/Pb/As/Hg on CA tow.
  - Polishing fails to keep Cycle-20 CA nicotine <50 mg/kg dry or Cd/Pb below use-gate limits.
  - BMED current efficiency <85% at Cycle 10 or post-CIP <90%.
  - N2 blanketing fails to keep vessel O2 <8% or condenser recovery <95%.
falsifiers:
  - ICP-MS/OES showing >25% Cd/Pb/As/Hg remaining on CA tow post-M01-Gate.
  - Cycle-20 CA nicotine >50 mg/kg dry or Cd/Pb exceeding use-gate limits.
  - BMED current efficiency <85% at Cycle 10 or post-CIP <90%.
  - N2 blanketing fails to keep vessel O2 <8% or condenser recovery <95%.
