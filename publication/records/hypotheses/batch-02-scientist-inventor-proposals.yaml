priorContext: Batch-02 established that all six method families fail at least one field of the four-field sink. The Scientist-Inventor role (operator-authorized 2026-11-17) produced five falsifiable engineering variants (M01-Gate, J-H-01-M, F3-SC, F2-VSC, F5-ED) with executable simulations, each designed to address the metals stop-condition and the four-field sink prerequisite.
mechanism: "Each variant pairs an upstream M01-Gate (dry-pneumatic + triboelectric pre-fractionation) with a downstream polishing step (counter-current wash + GAC/IDA, microfiltration + EtOH/CO2 antisolvent, vacuum-vented extrusion + acid/S-GAC, or BMED + CIP) to close the four-field sink: dry-mass balance, analyte-resolved fate, named treatment route, and use-specific product gate."
assumptions:
  - M01-Gate diverts >=75% of Cd, Pb, As mass into the ash/fines + residual tobacco fraction.
  - GAC/IDA, EtOH/CO2, acid/S-GAC, and BMED polishing reduce residual nicotine/metals below Tier-1/Tier-2 use-gate limits.
  - All simulations use representative feed loadings and are labeled ai_inference / ai_proposal, not measured values.
unresolvedDependencies:
  - Authorized M01-M08 laboratory measurement to validate partition coefficients and polishing efficiency.
  - Jurisdiction-specific Tier-1/Tier-2 product gate limits.
  - Qualified facility, risk assessment, and lawful contaminated-waste handling for any physical execution.
failureModes:
  - M01-Gate leaves >25% of Cd/Pb/As/Hg on CA tow.
  - Polishing fails to keep Cycle-20 CA nicotine <50 mg/kg dry or Cd/Pb below use-gate limits.
  - Membrane/sorbent fouling or solvent recovery failure exceeds cost or energy thresholds.
falsifiers:
  - ICP-MS/OES showing >25% Cd/Pb/As/Hg remaining on CA tow post-M01-Gate.
  - Cycle-20 CA nicotine >50 mg/kg dry or Cd/Pb exceeding use-gate limits.
  - BMED current efficiency <85% at Cycle 10 or post-CIP <90%.
