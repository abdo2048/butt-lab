products:
  - id: washed-fibre
    label: Washed cellulose acetate fibre
    description: Dried, optionally milled filter material recovered after washing. Its residual contaminant content and mechanical properties are not established by any located source.
    intendedUse: Not established. No product standard accepts washed filter material for any stated use.
sinks:
  - id: washed-material-sink
    material: Cellulose acetate recovered from cigarette filters, in a material split reported by a company rather than a product specification.
    intendedUse: A composite filler and, in one described route, thermo-compressed sheets for outdoor furniture. Use-compliance is not demonstrated by any located source.
    acceptanceBasis: Not established. No product gate, leaching test or regulatory acceptance has been located for this material.
    issuer: Not established. No company, standard body or authority has been located as the issuer of an accepted product.
    finalRoute: Not established. The wash water, the rejected solids and the sludge have no demonstrated final disposal route in any located source.
