schemaVersion: 1
id: mechanical-physical
title: Mechanical separation with aqueous washing
publicationState: approved
auditAliases:
  - F0
  - F1
  - batch-02 F0
  - batch-02 F1
kind: method-family
family: mechanical-physical
summary: The butt is broken up and washed in water, so that the cellulose acetate filter fraction is separated from the paper, tobacco and ash, and the surface residues are carried away in the wash water.
mechanism: "Two variants sit in this family. In staged washing, butts are washed in water and then optionally in ethanol, and the filter material is recovered without being dissolved. In the grinding route, butts are milled so that the filter fraction separates from the paper and tobacco matrix, sieved out, washed in water, dried and milled again into fibrous particles. In both variants the question is the same: whether washing removes contaminants from the fibre or only redistributes them between fibre, water and sludge."
feedstock: Collected whole spent cigarette butts, including filter, paper and residual tobacco. The mass basis of a collected lot is not stated by any located source, and it is not established whether butts must be dry before processing.
preparation: Drying where the lot is wet, then either direct washing or grinding and sieving to separate the filter fraction from the paper, tobacco and ash fraction.
steps:
  - id: collection
    label: Collection and drying
    description: Spent cigarette butts are collected from ash trays, bins or street litter and dried where the lot is wet. No located source states a moisture content or a drying protocol for collected butts.
  - id: separation
    label: Separation of the filter fraction
    description: In the grinding variant, butts are milled so that the plastic filter separates from the tobacco and paper matrix, and sieves recover the filter fraction while the paper, tobacco and ash fraction is rejected as a separate stream. No located source states a particle size, a sieve aperture, or how much of the fines fraction is lost with the rejected stream.
  - id: water-wash
    label: Aqueous wash
    description: The filter fraction is agitated in water so that surface dust, loose tobacco and dissolved residues are carried into the wash water. Some described designs use more than one wash tank in sequence and recycle the wash water. No located source states a wash temperature, a contact time, a water-to-feed ratio, or whether the recycled water receives any treatment or purge.
  - id: ethanol-wash
    label: Optional ethanol wash
    description: In the staged variant, a second wash in ethanol is used for residues that water does not dissolve. No located source states an ethanol concentration, a ratio or a recovery method, and this step is described only in the literature and company material, not in a located operating record.
  - id: drying-and-fibrous-form
    label: Drying and size reduction
    description: The washed material is dried and may be milled into a fibrous or particulate form. The batch-02 source documents give illustrative temperature ranges for drying and state that these are inventor choices rather than measured reference values; no located source states a drying protocol.
inputs:
  - id: collected-butts
    label: Collected spent cigarette butts
    description: Whole collected butts, including the filter, the paper wrapper, residual tobacco and ash.
  - id: process-water
    label: Process water
    description: Wash water, some described designs recovering it through a closed loop with a limited capacity per cycle.
  - id: optional-ethanol
    label: Ethanol, optional
    description: Used in the staged variant only, to dissolve residues that water does not.
