tooltip: The plastic filter material most cigarette filters are made from.
explanation: Cellulose acetate is the thermoplastic material in the filter of a finished cigarette. Recovering it intact is the goal of the solvent-based routes; the washing and incorporation routes keep it physically intact but chemically unchanged. Its properties after any recycling route are not established for the material collected from cigarette filters, because no located source characterises the recovered polymer on a comparable basis.
