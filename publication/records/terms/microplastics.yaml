tooltip: Small plastic fragments produced when filters are handled or degraded.
explanation: The cellulose acetate filter is itself a source of microplastic fragments, and size reduction steps turn butts into a particle stream. Washing does not remove that potential, and partial biological degradation does not eliminate it. The magnitude is not measured in any located source.
