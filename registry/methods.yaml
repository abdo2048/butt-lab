  - id: tchaomegot-sc-co2
    name: TchaoMegot supercritical CO2 depollution
    source_type: patent + company
    assignee: TchaoMegot (Julien Paque), FR
    patents: [FR3102180A1, WO2021079050A1, US12065781B2, US20260115774A1]
    mechanism_class: supercritical-fluid
    disclosed: pressure 50-350 bar (pref 280-320), temp 15-80 C, autoclave,
      co-solvents, chelating agents incl calixarene, ultrasound assist,
      contact 1 min - 8 h
    equipment: modified commercial SC-CO2 extractor (ex-fish-oil aroma), 5L -> 500L vessels
    outputs: clean fiber 99.7% (insulation, textile padding), dry concentrate 0.3%
    gaps: [cycle time, co-solvent identity/dosing, chelation dosing, fiber
      de-clumping, throughput economics, press-quote 50/60 bar vs patent 280-320 bar]
    legal_status: active, ~2039-2040 expiry, FR/WO/US family
    citations: patents.google.com/patent/FR3102180A1/en; tchaomegot.com
    status: pending_deep_dive

