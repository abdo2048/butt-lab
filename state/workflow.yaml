release_gate:
  artifact:
    builder: tools/reader-site/scripts/build-artifact.ts
    identity: the sha256 of artifact-manifest.json, which lists every file with its own hash
    contents: the built site, the bundle manifest, and artifact-manifest.json
  verifier:
    script: tools/reader-site/scripts/verify-approval.ts
    behaviour: refuses on a missing approval, a different commit, version, build run or
      artifact hash, a changed file, or an extra file; it never approves
  build_workflow: .github/workflows/build.yml
  build_workflow_capability: builds, validates and uploads an artifact; it cannot deploy
  deploy_workflow: .github/workflows/deploy.yml
  deploy_workflow_capability: workflow_dispatch only; verifies the approval against the
    artifact bytes before it deploys
  approval_record: operator/deployment-approval.json
  approval_record_state: not created; the gate therefore refuses every deployment
  status: release_gate_built_and_verified
  hosting_config:
    file: tools/reader-site/wrangler.jsonc
    worker_name: butt-lab
    shape: assets-only Worker; no script, no database; assets.directory is ./dist
    dry_run: npx wrangler deploy --dry-run exits 0, reads 121 files, uploads nothing
    wrangler_version: 4.164.0, pinned as an exact devDependency
  manual_guide:
    file: docs/DEPLOY.md
    audience: the operator, with no AI present
    steps: install, login, build, package the artifact, approve, request, verify, stage, deploy, read the URL, redeploy, rollback
  approval_template:
    file: operator/deployment-approval.template.json
    note: placeholders only; the gate refuses the template, so it cannot be mistaken for an approval
  operator_decision: >-
    The operator runs the deployment by hand. The agent does not publish, does not hold
    credentials and does not create the approval record.
  release_candidate:
    branch: feat/reader-platform
    commit: 1c0c402
    note: the Phase D commit. The commit that follows it only records this hash in
      state/workflow.yaml and state/session-log.md, so the built site bytes and the artifact
      hash are identical from either commit. When packaging the artifact, set
      SOURCE_COMMIT=1c0c402 so the artifact manifest, the operator's approval record and the
      release checklist all name the same commit.
  release_audit:
    script: tools/reader-site/scripts/release-audit.ts
    command: npm run audit:release in tools/reader-site
    tests: tools/reader-site/tests/release-audit.test.ts
    result: AUDIT records=134 findings=0 blocking=0 review=0 passed=true
    checks: >-
      Repository-path leaks, session-log references, credential-shaped strings, unresolved
      rights, link-only sources carrying derivatives, missing assessment rationales or
      unknown reasons, hypotheses not marked new-unvalidated-hypothesis, incomplete
      hypotheses or gaps, dangling cross-references, forbidden positive declarations,
      page language, title, landmarks and skip link, focus-visible, reduced motion,
      non-colour status and WCAG AA contrast.
    limitation: >-
      Contrast is resolved per CSS rule, so a colour inherited from an ancestor rule is
      approximate. Every ink-faint and ink-muted use was read by hand and confirmed to sit
      on a light surface.
  release_checklist:
    file: docs/RELEASE-CHECKLIST.md
    contents: >-
      Every check with its command and result, the corpus census, the dissent and
      openness position, the browser evidence, the two defects found and fixed, the
      limitations that were not verified, and the operator's single decision.
  browser_checks:
    where: real Chromium against the local preview on http://localhost:4321
    result: >-
      No console errors. Keyboard-only traversal reached the skip link, the brand, the
      search field and button and the six primary navigation links, each with a visible
      focus outline. The skip link moved focus into the main region. Right-to-left and
      360-pixel layouts showed no horizontal overflow. Lighthouse on /methods/ scored
      accessibility 1.0, best practices 1.0 and SEO 1.0 with zero failures. The search
      returned 28 pages for aluminium and honestly reported no page for zzzqqq.
    limitation: >-
      The harness could not deliver raw key presses to an unfocused window, so the search
      was driven by filling the field and submitting the form through its own submit path.
  defects_fixed_in_release_preparation:
    contrast: >-
      --ink-faint #7b8490 gave 3.30 to 1 for small text in nine rules. Changed to
      #5b6470, and --ink-muted #56616d to #4f5a66, preserving the hierarchy and clearing
      WCAG AA on every paper surface.
    search: >-
      Pagefind returns results as an array of items each with its own data promise, so
      the old results.slice(...).data() call threw and the catch branch reported that
      search was unavailable. The logic now lives in src/lib/search.ts and
      src/scripts/search.ts, is covered by tests, and keeps the Pagefind module lazy.
  final_verification:
    reader_site: 152 tests, 152 pass, 0 fail, 0 skipped; npx tsc --noEmit clean; npm run build exit 0 with 28 pages and 2056 indexed words
    publication_contract: 207 tests, 206 pass, 1 skipped, 0 fail; npm run validate reports VALID records=134 pages=10 assets=0; npx tsc --noEmit clean
    hosting_dry_run: npx wrangler deploy --dry-run exits 0, reads 121 files, uploads nothing

