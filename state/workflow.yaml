standing_constraints:
  - The metals stop-condition for Cd, Pb, As and Hg remains in force.
  - The four-field sink accounting requirement is unchanged.
  - Never declare any family or proposal clean, detoxified, safe, commercially validated, environmentally beneficial, novel, patentable, deployable or costed.
  - Unknown is not zero. Missing evidence stays parameter-not-located, source-not-located or unknown.
  - No invented efficiencies, prices, tests or simulations.
  - No freedom-to-operate, legal, regulatory or deployment determination.
  - No physical experiment, pilot, trial, publication or deployment without the operator's explicit approval.
  - Do not accept Batch-02, or any other deliverable, on the operator's behalf.
  - No whole-registry rewrite. Registries, backup and prior scientific files stay read-only.
  - File completion never means experimentally validated.

