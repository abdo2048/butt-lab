final_review:
  reviewer: fresh-context reviewer over the whole branch, source read only (the
    worktree is not indexed by the knowledge graph, so no graph access was used)
  range_reviewed: 9f3ffff..1af6e38
  verdict_before_fixes: NOT_READY
  findings_before_fixes: 1 critical, 4 important, 2 minor
  fixes:
    critical:
      - "The deploy workflow interpolated untrusted workflow_dispatch inputs into a shell heredoc, which could run commands before the approval check. The heredoc is gone and the inputs now reach scripts/deployment-request.ts only through env:, are validated against strict patterns, and are written with JSON.stringify."
    important:
      - "The verifier did not compare the artifact manifest's own sourceCommit and publicationVersion with the approval. It now refuses APPROVAL_ARTIFACT_COMMIT_MISMATCH and APPROVAL_ARTIFACT_VERSION_MISMATCH."
      - "The exposure audit missed a repository path inside markup, an unquoted credential assignment, a github_pat_ token, and text files containing a NUL byte. The patterns were widened and the NUL-byte skip removed."
      - "The shipped pages overstated the labelling guarantee while 77 of the 134 records carry no evidence state. The page text, the site footer and the README now state what carries an evidence state and what carries a role instead."
      - "The deploy workflow could not download its own cross-run artifact. actions read is now granted in the permissions block."
    minor_fixed:
      - "Markdown emphasis rendered literally in list items. The renderer now mirrors marked's default and a list item renders strong."
      - "24 pages repeated the site suffix in their title. The suffix is now added only when the title does not already end with it."
  tests: tools/reader-site/tests/release-review.test.ts, 20 tests, written first and
    watched fail with ERR_MODULE_NOT_FOUND
  verification_after_fixes:
    reader_site: 172 tests, 172 pass, 0 fail, 0 skipped; npx tsc --noEmit clean;
      npm run build exit 0 with 28 pages and 2058 indexed words;
      npm run audit:release reports 0 findings over 134 records
    publication_contract: 207 tests, 206 pass, 1 skipped (Windows symlink), 0 fail;
      VALID records=134 pages=10 assets=0
  status: fixed_and_verified
