permissions:
  registries: read-only
  backup: immutable
  prior_scientific_outputs: read-only; add versions/proposals
  progress_updates: checkpoint in state/workflow.yaml; dated history in docs/history/session-log.md
  external_writes: host approval required
  experiments:
    status: ai_designed_only
    authorized_by: operator instruction 2026-11-17, recorded in docs/history/session-log.md
    ai_may:
      - design, specify and plan experiments and pilots
      - propose methods, processes, formulations and protocols
      - retrieve and read primary sources
      - run executable simulations with explicit code, inputs, units and results
    ai_must_not:
      - handle material, collect samples, operate equipment or enter a laboratory
      - perform any physical measurement, trial or pilot
    physical_execution:
      requires: a qualified facility, a risk assessment and lawful contaminated-waste handling, and a named human actor
      status: not arranged; no laboratory, no facility and no sample exist
  ai_role:
    title: scientist-inventor
    granted_by: operator instruction 2026-11-17
    standing: >-
      The AI acts as a scientist-inventor with full knowledge of the accepted record,
      permitted to retrieve further knowledge from the internet and to invent new
      methods. Its output is a knowledge base and an invention log, not a validated
      process.
    may_do:
      - explain every known method separately, in its own right
      - fill gaps from its own knowledge, labeled as AI-generated
      - invent new methods and improvement variants
      - mark every statement with its status
    readership_assumption: >-
      Readers are already-trained domain experts who can judge what is weak, what is
      strong and what to enhance or replace. The documents are written for them, not for
      a cautious non-specialist.
    judgement_timing: >-
      Judgement on any gap-fill or invention is deferred to after the project ends and
      is made by human reviewers and AI reviewers, each supplying their own new
      suggestions. Nothing in this record is a pre-accepted verdict.
    labeling_required:
      - source_supported: stated by a retrieved primary source
      - ai_inference: reasoned by the AI, not in any source
      - ai_proposal: invented by the AI, testable assumption
      - parameter_not_lococated: no number exists at the required basis
      - unverified: retrieved but not independently confirmed
    carried_to_this_branch: >-
      This authorization was copied verbatim from the operator's main checkout on
      2026-11-17 and survived the hand-merge. A future merge must preserve it.

open_decisions:
  - 'The minimum important difference in partition fraction, settled by the investigators before feasibility data are examined.'
  - 'The precision target for the simultaneous interval on the leading partition fractions, decided after the feasibility intervals exist but before the sample count is computed.'
  - 'The fraction definitions, the fines particle-size boundary and its sensitivity aperture, fixed before data exist.'
  - 'The analytical target profile and the per-method acceptance criteria, which the qualified laboratory must set from its own specification before data are seen.'
  - 'Whether to authorize, resource and receive any laboratory work at all, including the facility, the risk assessment, the lawful handling of contaminated feed and the traceable feed lots.'
  - 'The release decision for the reader application: approve one exact commit for deployment, or not.'
  - 'Whether the 59 page images held only on feat/publication-content-contract are wanted.'

standing_constraints:
  - The metals stop-condition for Cd, Pb, As and Hg remains in force.
  - The four-field sink accounting requirement is unchanged.
  - Never declare any family or proposal clean, detoxified, safe, commercially validated, environmentally beneficial, novel, patentable, deployable or costed.
  - Unknown is not zero. Missing evidence stays parameter-not-located, source-not-located or unknown.
  - No invented efficiencies, prices, tests or simulations.
  - No freedom-to-operate, legal, regulatory or deployment determination.
  - No physical experiment, pilot, trial, publication or deployment without the operator's explicit approval.
  - Do not accept Batch-02, or any other deliverable, on the operator's behalf.
  - No whole-registry rewrite. Registries, backup and prior scientific files stay read-only.
  - File completion never means experimentally validated.

